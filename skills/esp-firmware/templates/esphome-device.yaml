# ESPHome device template. Secrets go in secrets.yaml (do not commit it).
# Check with the MCP tools esphome_lint (static) and esphome_validate (esphome config).
substitutions:
  name: kitchen-sensor
  friendly_name: Kitchen Sensor

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf          # default since ESPHome 2026.1; use arduino only for Arduino-only components

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key   # generate: `openssl rand -base64 32`

ota:
  - platform: esphome
    encryption:            # ESPHome 2026.9+, reuses the api key; older versions: password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_ap_password

captive_portal:

i2c:
  sda: GPIO6
  scl: GPIO7

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
