# ESPHome-Gerätevorlage. Secrets in secrets.yaml (nicht einchecken).
# Prüfen: MCP-Tools esphome_lint (statisch) und esphome_validate (esphome config).
substitutions:
  name: sensor-kueche
  friendly_name: Sensor Küche

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf          # Standard seit ESPHome 2026.1; arduino nur für Arduino-only-Komponenten

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key   # erzeugen: `openssl rand -base64 32`

ota:
  - platform: esphome
    encryption:            # ab ESPHome 2026.9, nutzt den api-Schlüssel; ältere Versionen: password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_ap_password

captive_portal:

i2c:
  sda: GPIO6
  scl: GPIO7

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
