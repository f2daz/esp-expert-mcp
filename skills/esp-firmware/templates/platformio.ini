; PlatformIO template for ESP32 (Arduino core 3.x via pioarduino) and ESP8266.
; Pin versions – current releases: MCP tool framework_versions("pioarduino-espressif32").

[platformio]
default_envs = esp32s3

[env]
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    ; bblanchon/ArduinoJson@^7

[env:esp32s3]
; Insert a release URL from github.com/pioarduino/platform-espressif32/releases
platform = https://github.com/pioarduino/platform-espressif32/releases/download/<VERSION>/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder, time
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:d1_mini]
platform = espressif8266@<VERSION>
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder, time
