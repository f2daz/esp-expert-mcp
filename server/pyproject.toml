[project]
name = "esp-expert-mcp"
version = "0.1.0"
description = "MCP server for ESP32/ESP8266 firmware development: pin checks, partition tables, panic decoder, sdkconfig, serial ports, live versions, ESPHome lint."
requires-python = ">=3.11"
license = "MIT"
license-files = ["../LICENSE"]
dependencies = [
    "mcp>=2.2,<3",
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.scripts]
esp-expert-mcp = "esp_expert_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_expert_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
